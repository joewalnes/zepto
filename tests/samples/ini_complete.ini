# INI sample file demonstrating syntax features
# This is a comment using hash

; This is also a comment using semicolon

[general]
name = MyApplication
version = 1.0.0
debug = true
verbose = false

[database]
; Database connection settings
host = localhost
port = 5432
name = myapp_db
user = dbuser
password = "secret password with spaces"

[database.pool]
min_connections = 5
max_connections = 20
timeout = 30.5

[server]
host = 0.0.0.0
port = 8080
workers = 4
ssl_enabled = yes  ; Boolean as yes/no
keepalive = on     ; Boolean as on/off

[paths]
; File paths
data_dir = /var/lib/myapp/data
log_file = /var/log/myapp/app.log
temp_dir = ${TEMP}/myapp

[logging]
level = INFO
format = %(asctime)s - %(name)s - %(levelname)s - %(message)s
file = ${paths:log_file}
max_size = 10485760
backup_count = 5

[cache]
enabled = true
type = redis
host = 127.0.0.1
port = 6379
ttl = 3600
prefix = myapp:

[email]
smtp_host = smtp.example.com
smtp_port = 587
smtp_user = noreply@example.com
smtp_password = "email_password"
use_tls = true
from_address = "MyApp <noreply@example.com>"

[features]
; Feature flags
new_ui = false
beta_features = true
experimental = no

[limits]
max_upload_size = 52428800
max_requests_per_minute = 100
session_timeout = 1800

[api]
base_url = https://api.example.com/v1
api_key = ${API_KEY}
timeout = 30
retry_count = 3

[internationalization]
default_language = en
supported_languages = en,es,fr,de,ja
fallback = en

; Empty section
[empty_section]

[special.characters]
path_with_spaces = "C:\Program Files\MyApp"
url = https://example.com/path?query=value&other=123
regex_pattern = ^[a-zA-Z0-9]+$
