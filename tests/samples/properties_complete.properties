# Java Properties sample file demonstrating syntax features
# Application configuration

# Basic key-value pairs
app.name=MyApplication
app.version=1.0.0
app.description=A sample application for testing

# Using colon as separator
app.author: John Doe
app.company: Example Corp

# Boolean values
app.debug=true
app.production=false

# Numeric values
server.port=8080
server.threads=10
server.timeout=30000
cache.size=1024
cache.ttl=3600.5

# Strings with spaces
app.title=My Awesome Application
app.welcome.message=Welcome to the application!

# Special characters (escaped)
path.separator=\\
message.newline=Line1\\nLine2
message.tab=Column1\\tColumn2

# Unicode escapes
unicode.smiley=\\u263A
unicode.heart=\\u2665

# Empty value
empty.value=

# Whitespace handling
whitespace.leading=   value with leading spaces preserved after =
whitespace.key = value

# Line continuation with backslash
long.text=This is a very long line that needs to be \
    continued on the next line for better \
    readability in the properties file.

multiline.list=item1,\
              item2,\
              item3,\
              item4

# Database configuration
database.url=jdbc:postgresql://localhost:5432/myapp
database.username=dbuser
database.password=secret123
database.driver=org.postgresql.Driver
database.pool.min=5
database.pool.max=20

# Logging
logging.level.root=INFO
logging.level.com.example=DEBUG
logging.pattern=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n
logging.file=/var/log/myapp/application.log

# Email settings
mail.smtp.host=smtp.example.com
mail.smtp.port=587
mail.smtp.auth=true
mail.smtp.starttls.enable=true
mail.from=noreply@example.com

# Feature flags
feature.newUI.enabled=false
feature.beta.enabled=true
feature.experimental=false

# Variable references (common in Spring)
service.url=${SERVICE_HOST:localhost}:${SERVICE_PORT:8080}
api.key=${API_KEY}

# URLs and paths
api.endpoint=https://api.example.com/v1/users
file.upload.path=/var/uploads
temp.directory=${java.io.tmpdir}/myapp

# Internationalization
i18n.default.locale=en_US
i18n.supported.locales=en_US,es_ES,fr_FR,de_DE

# Message bundles
message.greeting=Hello, {0}!
message.farewell=Goodbye, {0}. See you soon!
message.error.notfound=Resource {0} was not found.

! Alternative comment style using exclamation mark
! This is also a valid comment in properties files

# Keys with dots and hyphens
my-app.config.some-setting=value
com.example.myapp.setting=another-value
