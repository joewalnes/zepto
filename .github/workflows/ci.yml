name: CI

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Perl
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: '5.38'

      - name: Syntax check
        run: make check

      - name: Unit tests
        run: make test

      - name: Build
        run: make build

  notify-failure:
    runs-on: ubuntu-latest
    needs: test
    if: failure()
    steps:
      - name: Create failure issue
        uses: actions/github-script@v7
        with:
          script: |
            const title = `CI failed on main: ${context.sha.slice(0, 7)}`;
            const body = [
              `**Commit:** ${context.sha}`,
              `**Author:** ${context.actor}`,
              `**Message:** ${context.payload.head_commit?.message?.split('\n')[0] || 'unknown'}`,
              `**Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'The CI pipeline failed on a push to `main`. Please investigate.',
            ].join('\n');

            // Check for existing open issue to avoid duplicates
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'ci-failure',
              per_page: 1,
            });

            if (existing.data.length > 0) {
              // Comment on existing issue instead
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body: body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['ci-failure'],
              });
            }
