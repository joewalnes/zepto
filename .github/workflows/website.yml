name: Deploy Website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Build website
        run: make website

      - uses: actions/upload-pages-artifact@v4
        with:
          path: website/out

      - id: deploy
        uses: actions/deploy-pages@v5
